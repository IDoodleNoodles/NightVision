[Keys]
; Key names: A-Z, 0-9, F1-F12, Space, Tab, Home, End, Insert, Delete, PageUp, PageDown, LShift, RShift,
; LCtrl, RCtrl, LAlt, RAlt, Up, Down, Left, Right, Minus, Equals, Tilde, Mouse3-Mouse7, or 0x hex.
; Gamepad buttons are pad: plus the hex code, such as pad:0x0001. Leave a key empty to turn it off.

; Shared button. A tap turns vision on or off, and a hold switches between night vision and thermal.
sToggleKey = N

; Specific buttons for each mode. A tap turns that mode on, and tapping again turns it off.
sNightVisionKey =
sThermalKey =

; A tap moves to the next colour preset of the current mode.
sPresetKey = J

; Hold while wearing a helmet to fit vision to it, and hold again to remove it. The helmet keeps
; its own mode and colour in this save.
sAssignKey = K

; How long a press must last to count as a hold, in seconds.
fHoldSeconds = 0.5

[General]
; When true, vision only works with a fitted helmet on and stops if it comes off.
bRequireAssignedHelmet = true

; When true, a power armor helmet is fitted automatically the first time you use a vision key in it.
bAutoFitPowerArmor = true

; Show on-screen messages. The log is always written.
bShowMessages = true

; Seconds to fade the effect in and out.
fTransitionSeconds = 0.35

; Set false to drop the colour filter for that mode. The picture keeps its natural colours, and the
; preset's brightness and contrast still apply.
bNightVisionColors = true
bThermalColors = true

[Overlay]
; tools\make_overlay.py in the source turns the alpha of a square PNG or DDS into one, as black shapes.
; SWF file in Data\Interface\NightVision, without the extension. Set to None to turn the overlay off.
; It only shows in first person.
sFile = main

; The flat screen the overlay is drawn on. Use HUDGlassFlat16x10.nif for 16:10, HUDGlassFlatUW.nif for
; ultrawide, or HUDGlassFlatSUW.nif for super ultrawide.
sScreenModel = Interface/Objects/HUDGlassFlat.nif

[Sound]
; Played when vision turns on and off. Leave a file empty for silence.
sOnFile = Data/F4SE/Plugins/NightVision/nvg_on.mp3
sOffFile = Data/F4SE/Plugins/NightVision/nvg_off.mp3

; 0 to 1. These play outside the game's audio sliders.
fVolume = 1.0

; Game sound played when the colour changes, by editor ID. This is the Pip-Boy tab knob, and it
; follows the game's audio sliders. Leave empty for silence.
sPresetSound = UIPipBoyRotaryHorizontalRight

[Thermal]
; Effect shaders put on warm actors, as Plugin|FormID. These are DetectLifeFXS and DetectLifeHostileFXS.
sShader = Fallout4.esm|22517C
sHostileShader = Fallout4.esm|22517E

; Range in game units. 20000 is about 285 metres. Actors in unloaded cells cannot glow, so a
; bigger value stops helping past your loaded area.
fRange = 20000

; Robots and turrets stay cold unless this is true.
bShowRobots = false

; Corpses stay cold unless this is true.
bShowDead = false

; Presets run in this order, and you can add your own with any name after the dot.
; sColor is red, green, blue from 0 to 1. fSaturation 0 is fully grey before the tint.
; fTintAmount, fBrightness and fContrast shape the picture. fBloomScale and fEyeAdaptStrength are
; optional, and a negative value keeps the game's own.
; fFilmGrain is the grain's opacity from 0 to 1, and 0 turns it off. It is part of the overlay, so it
; only shows in first person and sFile = None removes it too.
; fMotionBlur is the blur amount (the game's default is 50) and fMotionBlurMax its limit (default
; 0.01). Negative keeps the game's own.
; fDofStrength sets depth of field, and negative keeps the game's own. Things closer than fDofDistance
; stay sharp, and blur builds over fDofRange. It needs bDoDepthOfField=1 in Fallout4Prefs.ini.

[NightVision.Green]
sColor = 0.25, 1.0, 0.3
fTintAmount = 0.9
fSaturation = 0.0
fBrightness = 1.5
fContrast = 1.15
fBloomScale = 1.2
fEyeAdaptStrength = 0.1
fFilmGrain = 0.16
fMotionBlur = 120
fMotionBlurMax = 0.02
fDofStrength = 0.3
fDofDistance = 1500
fDofRange = 4000

